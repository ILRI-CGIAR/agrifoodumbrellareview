name: Scopus W00 retrieval and internal EID deduplication
on:
  push:
    branches: [migration/w00-w03]
    paths: ['.github/workflows/scopus_retrieve_dedup.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c("httr2","jsonlite","digest"))
      - name: Validate script syntax
        shell: Rscript {0}
        run: |
          parse(file="scripts/updater/scopus_retrieve_shard.R")
          parse(file="scripts/updater/scopus_merge_internal.R")
          parse(file="scripts/updater/scopus_archive_restricted_zenodo.R")
      - name: Restore saved Scopus count checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs/scopus/source
          gh run download 42258635034 --repo "$GITHUB_REPOSITORY" --name scopus-2015-api-probe --dir outputs/scopus/source
      - name: Retrieve and verify pages
        env:
          SCOPUS_API_TOKEN: ${{ secrets.SCOPUS_API_TOKEN }}
          SCOPUS_INSTTOKEN: ${{ secrets.SCOPUS_INSTTOKEN }}
        run: Rscript scripts/updater/scopus_retrieve_shard.R --shard ${{ matrix.shard }}
      - name: Save temporary partition handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scopus-2015-shard-${{ matrix.shard }}
          path: outputs/scopus/shard_${{ matrix.shard }}/
          retention-days: 1
          if-no-files-found: warn
  merge:
    needs: retrieve
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c("httr2","jsonlite","digest"))
      - name: Restore Scopus count checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs/scopus/source
          gh run download 42258635034 --repo "$GITHUB_REPOSITORY" --name scopus-2015-api-probe --dir outputs/scopus/source
      - uses: actions/download-artifact@v4
        with:
          name: scopus-2015-shard-0
          path: outputs/scopus/shard_0
      - uses: actions/download-artifact@v4
        with:
          name: scopus-2015-shard-1
          path: outputs/scopus/shard_1
      - uses: actions/download-artifact@v4
        with:
          name: scopus-2015-shard-2
          path: outputs/scopus/shard_2
      - uses: actions/download-artifact@v4
        with:
          name: scopus-2015-shard-3
          path: outputs/scopus/shard_3
      - uses: actions/download-artifact@v4
        with:
          name: scopus-2015-shard-4
          path: outputs/scopus/shard_4
      - name: Verify total and internally deduplicate EIDs
        run: Rscript scripts/updater/scopus_merge_internal.R
      - name: Save bibliographic records to restricted Zenodo
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: Rscript scripts/updater/scopus_archive_restricted_zenodo.R
      - name: Save count report and Zenodo receipt
        uses: actions/upload-artifact@v4
        with:
          name: scopus-2015-dedup-summary
          path: |
            outputs/scopus/dedup_summary.json
            outputs/scopus/zenodo_receipt.json
          retention-days: 30
