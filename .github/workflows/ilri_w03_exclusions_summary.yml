name: TEMP W03 excluded records summary from published artifact
on:
  push:
    branches: [migration/w00-w03]
    paths: ['.github/workflows/ilri_w03_exclusions_summary.yml']
permissions:
  contents: write
  actions: read
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/w00-w03
          fetch-depth: 0
      - name: Generate record-level exclusion summary from original successful W03
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original outputs docs/publication_status/summaries
          gh run download 42418518879 --repo "$GITHUB_REPOSITORY" --name workflow03-handoff-42418518879 --dir original
          python3 - <<'PY'
          import glob,json,csv,hashlib
          fs=glob.glob('original/**/publication_status.jsonl',recursive=True)
          assert len(fs)==1,fs
          rows=[json.loads(l) for l in open(fs[0],encoding='utf-8') if l.strip()]
          assert len(rows)==21054,len(rows)
          excluded=[]
          for x in rows:
            status=x['publication_status']
            if status['exclude_from_workflow04']:
              excluded.append({'record_id':x['record_id'],
                'publication_status':status['code'],
                'openalex_id':status['evidence']['openalex']['work_id'],
                'openalex_retracted':status['evidence']['openalex']['is_retracted'],
                'status_checked_at':status['checked_at'],
                'excluded_from_workflow04':'true'})
          assert len(excluded)==25,len(excluded)
          assert len({x['record_id'] for x in excluded})==25
          target=[x for x in excluded if x['record_id']=='work-62e05020845ad8b5']
          assert len(target)==1 and target[0]['publication_status']=='retracted' and target[0]['openalex_retracted'] is True,target
          path='docs/publication_status/summaries/w03_excluded_records_run-42418518879.csv'
          with open(path,'w',encoding='utf8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=excluded[0].keys());w.writeheader();w.writerows(sorted(excluded,key=lambda x:x['record_id']))
          summary={'schema':'ilri-w03-record-level-exclusions-summary-v1',
            'source_run_id':'42418518879','source_zenodo_doi':'10.5281/zenodo.24044731',
            'total_canonical_records':len(rows),
            'retracted_and_excluded':25,
            'target_retracted_record_id':'work-62e05020845ad8b5',
            'target_doi':'10.3390/ani13010157',
            'target_openalex_id':target[0]['openalex_id'],
            'target_already_counted_in_25':True,
            'excluded_ids':[z['record_id'] for z in sorted(excluded,key=lambda x:x['record_id'])],
            'source_w03_publication_status_sha256':hashlib.sha256(open(fs[0],'rb').read()).hexdigest(),
            'note':'W03 already flags this record as retracted and excludes it from W04. Original published W03 data is unchanged.'}
          with open('docs/publication_status/summaries/w03_retraction_summary_run-42418518879.json','w',encoding='utf8') as f:
            json.dump(summary,f,ensure_ascii=False,indent=2);f.write('\n')
          print('PASS: W03 published state reports 25 retractions; target record excluded, counted once')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/publication_status/summaries/w03_excluded_records_run-42418518879.csv docs/publication_status/summaries/w03_retraction_summary_run-42418518879.json
          git commit -m "Document 25 W03 excluded work IDs including retracted methane article"
          git pull --rebase origin migration/w00-w03
          git push origin HEAD:migration/w00-w03
