name: Correct provider names on restricted Lens and OpenAlex Zenodo deposits
on:
  push:
    branches: [migration/w00-w03]
    paths: ['.github/workflows/lens_openalex_correct_zenodo.yml']
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c("httr2","jsonlite"))
      - name: Correct and republish published restricted record metadata
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: Rscript scripts/updater/lens_openalex_correct_zenodo_metadata.R
      - name: Save metadata-edit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lens-openalex-zenodo-metadata-receipt
          path: outputs/metadata_correction/receipt.json
          retention-days: 30
          if-no-files-found: warn
