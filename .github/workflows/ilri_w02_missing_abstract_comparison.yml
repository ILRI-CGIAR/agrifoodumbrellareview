name: TEMP ILRI export missing-abstract identity list for manual RIS comparison
on:
  push:
    branches: [migration/w00-w03]
    paths: ['.github/workflows/ilri_w02_missing_abstract_comparison.yml']
permissions:
  contents: write
  actions: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/w00-w03
          fetch-depth: 0
      - name: Extract missing-abstract identities from verified reviewed W02
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p temp_verified docs/enrichment/manual_abstract_comparison
          gh run download 42417536880 --repo "$GITHUB_REPOSITORY" --name w02-reviewed-verified-42417536880 --dir temp_verified
          python3 - <<'PY'
          import json,csv,hashlib
          path='temp_verified/workflow02/enriched.jsonl'
          rows=[]
          n=0
          with open(path,encoding='utf8') as f:
            for line in f:
              if not line.strip(): continue
              r=json.loads(line); n+=1
              c=r.get('canonical') or {}
              if not str(c.get('abstract') or '').strip():
                identity=r.get('identity') or {}
                rows.append({'record_id':identity.get('record_id',''),
                  'doi':c.get('doi') or '', 'title':c.get('title') or '',
                  'year':c.get('year') or '', 'source_run':'42417536880'})
          assert n==21054,(n,len(rows))
          assert len(rows)==602,len(rows)
          assert len({r['record_id'] for r in rows})==602
          out='docs/enrichment/manual_abstract_comparison/missing_abstracts_w02_42418084454.csv'
          with open(out,'w',newline='',encoding='utf8') as f:
            w=csv.DictWriter(f,fieldnames=['record_id','doi','title','year','source_run']);w.writeheader();w.writerows(rows)
          print('PASS: identified 602 unique canonical records with no abstract')
          print('SHA256',hashlib.sha256(open(path,'rb').read()).hexdigest())
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/enrichment/manual_abstract_comparison/missing_abstracts_w02_42418084454.csv
          git commit -m "Stage W02 missing abstract identities for manual RIS-only crossmatch"
          git pull --rebase origin migration/w00-w03
          git push origin HEAD:migration/w00-w03
