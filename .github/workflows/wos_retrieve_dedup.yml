name: Web of Science 2015+ retrieval and internal UID deduplication
on:
  push:
    branches: [migration/w00-w03]
    paths: ['.github/workflows/wos_retrieve_dedup.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: wos-2015-retrieval
  cancel-in-progress: false
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R API dependencies
        shell: Rscript {0}
        run: install.packages(c("httr2","jsonlite","digest"))
      - name: Check retrieval, merge, archive script syntax
        shell: Rscript {0}
        run: |
          invisible(parse(file="scripts/updater/wos_retrieve_shard.R"))
          invisible(parse(file="scripts/updater/wos_merge_internal.R"))
          invisible(parse(file="scripts/updater/wos_archive_restricted_zenodo.R"))
          cat("PASS R syntax\n")
      - name: Restore verified WoS count checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "outputs/wos/count/shard_${{ matrix.shard }}"
          gh run download 42301105871 --repo "$GITHUB_REPOSITORY" --name "wos-count-shard-${{ matrix.shard }}" --dir "outputs/wos/count/shard_${{ matrix.shard }}"
          test -s "outputs/wos/count/shard_${{ matrix.shard }}/counts.json"
      - name: Retrieve complete WoS Starter pages
        env:
          WOS_STARTER_API: ${{ secrets.WOS_STARTER_API }}
        run: Rscript scripts/updater/wos_retrieve_shard.R --shard ${{ matrix.shard }}
      - name: Preserve temporary shard checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wos-2015-record-shard-${{ matrix.shard }}
          path: outputs/wos/shard_${{ matrix.shard }}/
          retention-days: 1
          if-no-files-found: warn
  merge:
    needs: retrieve
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R API dependencies
        shell: Rscript {0}
        run: install.packages(c("httr2","jsonlite","digest"))
      - name: Restore all five count checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for shard in 1 2 3 4 5; do
            mkdir -p "outputs/wos/count/shard_$shard"
            gh run download 42301105871 --repo "$GITHUB_REPOSITORY" --name "wos-count-shard-$shard" --dir "outputs/wos/count/shard_$shard"
          done
      - uses: actions/download-artifact@v4
        with:
          name: wos-2015-record-shard-1
          path: outputs/wos/shard_1
      - uses: actions/download-artifact@v4
        with:
          name: wos-2015-record-shard-2
          path: outputs/wos/shard_2
      - uses: actions/download-artifact@v4
        with:
          name: wos-2015-record-shard-3
          path: outputs/wos/shard_3
      - uses: actions/download-artifact@v4
        with:
          name: wos-2015-record-shard-4
          path: outputs/wos/shard_4
      - uses: actions/download-artifact@v4
        with:
          name: wos-2015-record-shard-5
          path: outputs/wos/shard_5
      - name: Verify 35 components and deduplicate by WoS UID
        run: Rscript scripts/updater/wos_merge_internal.R
      - name: Deposit records to restricted Zenodo
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: Rscript scripts/updater/wos_archive_restricted_zenodo.R
      - name: Save safe summary and deposit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wos-2015-dedup-summary
          path: |
            outputs/wos/dedup_summary.json
            outputs/wos/zenodo_receipt.json
          retention-days: 30
          if-no-files-found: warn
