name: ILRI W01 inspect source schemas
on:
  push:
    branches: [migration/w00-w03]
    paths:
      - .github/workflows/ilri_w01_schema_probe.yml
      - scripts/updater/ilri_w01_schema_probe.py
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ilri-w01-api-source-files
          path: w01_archive_inputs/
          run-id: 42386416321
          github-token: ${{ github.token }}
      - run: python3 scripts/updater/ilri_w01_schema_probe.py
