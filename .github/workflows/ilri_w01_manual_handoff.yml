name: ILRI W01 manual handoff readiness
on:
  push:
    branches: [migration/w00-w03]
    paths:
      - .github/workflows/ilri_w01_manual_handoff.yml
      - scripts/updater/ilri_w01_prepare_manual_handoff.R
  workflow_dispatch:
jobs:
  manual-handoff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::jsonlite
      - uses: actions/download-artifact@v4
        with:
          name: w00-manual-proquest
          path: w00_artifacts/w00-manual-proquest
          run-id: 42385413283
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: w00-manual-cab
          path: w00_artifacts/w00-manual-cab
          run-id: 42385413283
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: w00-manual-lilacs
          path: w00_artifacts/w00-manual-lilacs
          run-id: 42385413283
          github-token: ${{ github.token }}
      - name: Verify and prepare W01 manual source files
        run: Rscript scripts/updater/ilri_w01_prepare_manual_handoff.R
      - uses: actions/upload-artifact@v4
        with:
          name: ilri-w01-manual-handoff-not-full-corpus
          path: |
            current_sources/
            outputs/w01_manual_handoff.json
          retention-days: 30
