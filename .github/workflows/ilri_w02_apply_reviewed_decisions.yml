name: TEMP ILRI W02 apply reviewed decisions without provider calls
on:
  push:
    branches: [migration/w00-w03]
    paths: ['.github/workflows/ilri_w02_apply_reviewed_decisions.yml']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/w00-w03
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install parser and SHA dependencies
        shell: Rscript {0}
        run: install.packages(c('jsonlite','digest'))
      - name: Download original review and patch artifacts
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p saved/review saved/patch saved/final
          gh run download 42405126427 --repo "$GITHUB_REPOSITORY" --name workflow02-human-review-42405126427 --dir saved/review
          gh run download 42405126427 --repo "$GITHUB_REPOSITORY" --name workflow02-batched-final-42405126427 --dir saved/patch
          gh run download 42405126427 --repo "$GITHUB_REPOSITORY" --name workflow02-finalize-input-42405126427 --dir saved/final
      - name: Reconcile saved 100 reviews and replay original W02 canonical
        run: |
          set -euo pipefail
          mkdir -p outputs/workflow02 outputs/reviewed
          Rscript scripts/updater/workflow_02_reconcile_saved_human_review.R \
            --review-jsonl saved/review/workflow02_human_review.jsonl \
            --review-manifest saved/review/workflow02_human_review_manifest.json \
            --accept-keys docs/enrichment/w02_review_decisions/run-42405126427-accept-keys.txt \
            --patch saved/patch/workflow02/current_patch.jsonl \
            --out-patch outputs/workflow02/current_patch.jsonl \
            --out-audit outputs/workflow02/enrichment_audit.jsonl \
            --out-decisions outputs/reviewed/review_decisions.jsonl \
            --out-report outputs/reviewed/reconciliation_report.json
          Rscript scripts/updater/workflow_02_apply_patch.R \
            --input saved/final/workflow01_state/canonical/records.jsonl \
            --patch outputs/workflow02/current_patch.jsonl \
            --output outputs/workflow02/enriched.jsonl \
            --report outputs/reviewed/replay_report.json \
            --mode exact
          Rscript scripts/updater/workflow_02_build_human_review.R \
            --input saved/final/workflow01_state/canonical/records.jsonl \
            --audit outputs/workflow02/enrichment_audit.jsonl \
            --output-dir outputs/reviewed/remaining \
            --status outputs/reviewed/remaining/status.json
          Rscript -e 'x<-jsonlite::fromJSON("outputs/reviewed/remaining/status.json");stopifnot(!x$requires_human_review);cat("PASS: all metadata conflicts resolved\n")'
      - name: Upload verified review and canonical patch
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: w02-reviewed-verified-\${{ github.run_id }}
          path: |
            outputs/workflow02/current_patch.jsonl
            outputs/workflow02/enrichment_audit.jsonl
            outputs/workflow02/enriched.jsonl
            outputs/reviewed/
          retention-days: 90
          if-no-files-found: error
      - name: Upload failure diagnostics
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: w02-review-diagnostics-\${{ github.run_id }}
          path: outputs/reviewed/
          retention-days: 90
          if-no-files-found: warn
