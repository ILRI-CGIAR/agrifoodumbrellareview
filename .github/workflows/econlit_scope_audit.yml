name: W00 EconLit independent scope audit
on:
  push:
    branches: [migration/w00-w03]
    paths: ['.github/workflows/econlit_scope_audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c("httr2","xml2","jsonlite","digest"))
      - name: Run EconLit scope sensitivity audit
        env:
          EBSCO_EHOST_UID: ${{ secrets.EBSCO_EHOST_UID }}
          EBSCO_EHOST_PWD: ${{ secrets.EBSCO_EHOST_PWD }}
        run: Rscript scripts/updater/econlit_count_probe.R --audit
      - name: Save audit findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: econlit-sensitivity-audit
          path: outputs/econlit/count/sensitivity_audit.json
          retention-days: 30
          if-no-files-found: warn
