name: Web of Science 2015+ partitioned count probe
on:
  push:
    branches: [migration/w00-w03]
    paths: ['.github/workflows/wos_partition_count.yml']
permissions:
  contents: read
  actions: read
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c("httr2","jsonlite","digest"))
      - name: Verify R script parses
        shell: Rscript {0}
        run: invisible(parse(file="scripts/updater/wos_partition_count.R"))
      - name: Count WoS search partitions
        env:
          WOS_STARTER_API: ${{ secrets.WOS_STARTER_API }}
        run: Rscript scripts/updater/wos_partition_count.R --shard ${{ matrix.shard }}
      - name: Archive count-only diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wos-count-shard-${{ matrix.shard }}
          path: outputs/wos/shard_${{ matrix.shard }}/counts.json
          retention-days: 7
          if-no-files-found: warn
  summarise:
    needs: count
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wos-count-shard-*
          path: all-wos
          merge-multiple: false
      - name: Summarise query counts
        run: |
          python3 - <<'PY'
          import json,glob
          files=glob.glob("all-wos/wos-count-shard-*/counts.json")
          assert len(files)==5, f"Expected five WoS count outputs; found {len(files)}"
          total=0
          n=0
          for file in sorted(files):
              data=json.load(open(file))
              assert data["complete"] and data["pending"]==0 and not data["errors"], file
              t=sum(int(x["total_results"]) for x in data["summaries"])
              n+=len(data["summaries"])
              total+=t
              print(f'Shard {data["shard"]}: {len(data["summaries"])} queries; summed hits {t}')
          print(f'PASS: {n} successful count partitions; summed hits {total}')
          print("IMPORTANT: overlapping partition counts are not unique Web of Science records")
          PY
