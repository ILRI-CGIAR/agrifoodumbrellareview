name: Web of Science 2015+ count-only syntax probe
on:
  push:
    branches: [migration/w00-w03]
    paths:
      - '.github/workflows/wos_count_probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c("httr2","jsonlite"))
      - name: Test translated WoS queries
        env:
          WOS_STARTER_API: ${{ secrets.WOS_STARTER_API }}
        run: Rscript scripts/updater/wos_count_probe.R
      - name: Save count and search diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wos-2015-count-probe
          path: outputs/wos/
          retention-days: 7
          if-no-files-found: warn
