name: Lens and OpenAlex dataset-excluded retrieval and dedup
on:
  push:
    branches: [migration/w00-w03]
    paths: ['.github/workflows/lens_openalex_retrieve.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        provider: [lens, openalex]
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c("httr2","jsonlite","digest"))
      - name: Parse R retrieval merge archive scripts
        shell: Rscript {0}
        run: |
          invisible(parse(file="scripts/updater/lens_openalex_retrieve_shard.R"))
          invisible(parse(file="scripts/updater/lens_openalex_merge.R"))
          invisible(parse(file="scripts/updater/lens_openalex_archive_zenodo.R"))
      - name: Restore validated 2015+ dataset-excluded count
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "outputs/${{ matrix.provider }}/count/shard_${{ matrix.shard }}"
          gh run download 42308597779 --repo "$GITHUB_REPOSITORY" --name "${{ matrix.provider }}-dataset-excluded-count-${{ matrix.shard }}" --dir "outputs/${{ matrix.provider }}/count/shard_${{ matrix.shard }}"
      - name: Retrieve paginated records and verify dataset exclusion
        env:
          LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_API_TOKEN: ${{ secrets.OPENALEX_API_TOKEN }}
        run: Rscript scripts/updater/lens_openalex_retrieve_shard.R --provider ${{ matrix.provider }} --shard ${{ matrix.shard }}
      - name: Store source-provenance metadata shard temporarily
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.provider }}-records-${{ matrix.shard }}
          path: outputs/${{ matrix.provider }}/shard_${{ matrix.shard }}/
          retention-days: 1
          if-no-files-found: warn
  merge:
    needs: retrieve
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        provider: [lens, openalex]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c("httr2","jsonlite","digest"))
      - name: Restore count snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for shard in 1 2 3 4 5; do
            mkdir -p "outputs/${{ matrix.provider }}/count/shard_$shard"
            gh run download 42308597779 --repo "$GITHUB_REPOSITORY" --name "${{ matrix.provider }}-dataset-excluded-count-$shard" --dir "outputs/${{ matrix.provider }}/count/shard_$shard"
          done
      - name: Restore all five bibliographic shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for shard in 1 2 3 4 5; do
            mkdir -p "outputs/${{ matrix.provider }}/shard_$shard"
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "${{ matrix.provider }}-records-$shard" --dir "outputs/${{ matrix.provider }}/shard_$shard"
          done
      - name: Deduplicate by source identifier
        run: Rscript scripts/updater/lens_openalex_merge.R --provider ${{ matrix.provider }}
      - name: Deposit restricted Zenodo archive
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: Rscript scripts/updater/lens_openalex_archive_zenodo.R --provider ${{ matrix.provider }}
      - name: Preserve summary and restricted receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.provider }}-2015-dataset-excluded-summary
          path: |
            outputs/${{ matrix.provider }}/dedup_summary.json
            outputs/${{ matrix.provider }}/zenodo_receipt.json
          retention-days: 30
          if-no-files-found: warn
