name: ILRI W01 full-corpus source restoration
on:
  workflow_dispatch:
  push:
    branches: [migration/w00-w03]
    paths:
      - .github/workflows/ilri_w01_restore_api_sources.yml
      - scripts/updater/ilri_w01_restore_api_sources.py
      - config/ilri_w01_source_archives.json
jobs:
  restore-api-sources:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate five restricted W00 API archives
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: python3 scripts/updater/ilri_w01_restore_api_sources.py
      - name: Save W01 source restoration inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ilri-w01-api-source-inventory
          path: outputs/w01_api_restore_inventory.json
          if-no-files-found: warn
      - name: Retain restricted source files for continuation
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ilri-w01-api-source-files
          path: outputs/w01_api_restored/
          retention-days: 14
