name: ILRI W01 initial full-corpus deduplication
on:
  push:
    branches: [migration/w00-w03]
    paths:
      - .github/workflows/ilri_w01_deduplicate.yml
      - scripts/updater/ilri_w01_normalize_sources.R
  workflow_dispatch:
jobs:
  w01-deduplication:
    name: W01 deduplicate 46361 ILRI source records
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::data.table
            any::digest
            any::stringdist
            any::stringi
            any::xml2
      - name: Restore five validated API-source archives
        uses: actions/download-artifact@v4
        with:
          name: ilri-w01-api-source-files
          path: w01_archive_inputs
          run-id: 42386416321
          github-token: ${{ github.token }}
      - name: Restore three validated manual W00 inputs
        uses: actions/download-artifact@v4
        with:
          name: ilri-w01-manual-handoff-not-full-corpus
          path: w01_archive_inputs/manual
          run-id: 42385813489
          github-token: ${{ github.token }}
      - name: Normalize all eight W00 sources and check counts and source IDs
        run: Rscript scripts/updater/ilri_w01_normalize_sources.R
      - name: Initialize fresh ILRI W01 deduplication
        run: |
          mkdir -p outputs/w01
          printf 'source,source_record_id\n' > outputs/w01/empty_prior_manifestations.csv
      - name: Generate actual duplicate candidates and score initial calibration sample
        run: |
          Rscript scripts/updater/workflow_01_deduplication_incremental_candidates.R \
            --input-manifest outputs/ilri_w01_sources.json \
            --old-metadata outputs/w01/empty_prior_manifestations.csv \
            --output-dir outputs/w01/candidates \
            --workflow01-run-id "${{ github.run_id }}" \
            --score-n 2000
      - name: Save W01 input and deduplication outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ilri-w01-initial-deduplication-${{ github.run_id }}
          path: |
            outputs/ilri_w01_sources.json
            outputs/w01/
          if-no-files-found: warn
          retention-days: 30
