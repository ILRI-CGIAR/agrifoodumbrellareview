name: TEMP validate W00 original handlers and W01 handoff offline
on:
  push:
    branches: [migration/w00-w03]
    paths: ['.github/workflows/temp_w00_full_validation.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/w00-w03
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependencies
        run: |
          Rscript -e "install.packages(c('jsonlite','digest','httr2'))"
      - name: Validate source planner, original handler dry run, provenance, archive and W01 adapters
        run: |
          set -euo pipefail
          mkdir -p outputs/offline/plan
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('outputs/offline/search_strategy.json')
          q={'schema':'evidence-search-strategy-v1','search_version':'test-001','sources':{
            'scopus':{'database_name':'Scopus','platform':'Scopus API','search_fields':['title','abstract','keywords'],
              'queries':{'full':{'query':'TITLE-ABS-KEY("synthetic term")'}}},
            'wos':{'database_name':'Web of Science','platform':'WoS API','search_fields':['title','abstract','author_keywords'],
              'queries':{'full':{'query':'TI=("synthetic term") OR AB=("synthetic term") OR AK=("synthetic term")'}}}
          }}
          p.write_text(json.dumps(q))
          PY
          mkdir -p outputs/offline/harvests/scopus/source_child/raw outputs/offline/harvests/wos/source_child/raw
          Rscript scripts/updater/workflow_00_search_orchestrator.R             --run-type full --config outputs/offline/search_strategy.json             --output-dir outputs/offline/plan
          for SOURCE in scopus wos; do
            Rscript scripts/updater/workflow_00_execute_source.R               --search-plan outputs/offline/plan/search_plan.json --source "$SOURCE"               --output-root outputs/offline/harvests --execute false
          done
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('outputs/offline/harvests')
          items={
            'scopus':{'raw':{'search-results':{'entry':[{'eid':'2-s2.0-111','dc:identifier':'SCOPUS_ID:111','dc:title':'Synthetic reference on rainfall','prism:coverDate':'2025-01-02'}]}},'manifest':{'status':'success','unpartitioned_total':1,'entries_retrieved':1,'base_query':'TITLE-ABS-KEY("synthetic term")'}},
            'wos':{'raw':{'hits':[{'uid':'WOS:12345','title':'Synthetic reference on rainfall','identifiers':{'doi':'10.9999/test.001'},'source':{'publishYear':'2025','sourceTitle':'Synthetic Journal'},'names':{'authors':[{'displayName':'Test, A'}]}}]},'manifest':{'status':'success','reported_total':1,'records_retrieved':1,'query':'TI=("synthetic term") OR AB=("synthetic term") OR AK=("synthetic term")'}}
          }
          for src,x in items.items():
            dest=root/src/'source_child'
            (dest/'raw'/'response_000001.json').write_text(json.dumps(x['raw']))
            (dest/'manifest.json').write_text(json.dumps(x['manifest']))
            (dest/'execution_metadata.json').write_text(json.dumps({
              'query':x['manifest'].get('query',x['manifest'].get('base_query')),
              'started_at_utc':'2026-02-01T09:00:00Z',
              'completed_at_utc':'2026-02-01T09:05:00Z'}))
          pathlib.Path('outputs/offline/zenodo_metadata.json').write_text(json.dumps({
            'title':'Synthetic evidence review regression','creators':[{'name':'Tester, Example'}]}))
          PY
          mkdir -p outputs/offline/empty_history outputs/offline/search_records
          for SOURCE in scopus wos; do
            Rscript scripts/updater/workflow_00_native_id_reconcile.R               --source "$SOURCE" --run-type full               --current-root "outputs/offline/harvests/$SOURCE/source_child"               --history-root outputs/offline/empty_history               --output-dir "outputs/offline/harvests/$SOURCE/native_id_reconciliation"
            Rscript scripts/updater/workflow_00_record_source.R               --search-plan outputs/offline/plan/search_plan.json               --source "$SOURCE" --output-root outputs/offline
          done
          Rscript scripts/updater/workflow_00_validate_search_receipts.R             --search-plan outputs/offline/plan/search_plan.json             --receipts-dir outputs/offline/search_records             --output outputs/offline/plan/source_search_report.json
          mkdir -p outputs/offline/archive
          Rscript scripts/updater/workflow_00_archive_to_zenodo.R             --staging-root outputs/offline --run-id 123456             --repository example/synthetic --run-type full --search-version test-001             --sources scopus,wos             --zenodo-config outputs/offline/zenodo_metadata.json             --output-dir outputs/offline/archive --validate-only true
          test -s outputs/offline/archive/offline_validation.json
          Rscript scripts/updater/workflow_01s_scopus_sidecar_adapter.R             --input-dir outputs/offline/harvests/scopus             --output-dir outputs/offline/w01_scopus
          Rscript scripts/updater/workflow_01w_wos_starter_sidecar_adapter.R             --input-dir outputs/offline/harvests/wos             --output-dir outputs/offline/w01_wos
          python3 - <<'PY'
          import json,pathlib,glob
          root=pathlib.Path('outputs/offline')
          for source in ['scopus','wos']:
            files=list((root/('w01_'+source)).rglob('*.jsonl'))
            assert files,source
            assert any(x.read_text().strip() for x in files),source
          archived=list((root/'archive'/'archive_files').glob('*-harvest.tar.gz'))
          assert len(archived)==2,len(archived)
          print('PASS: complete offline W00 planning, native IDs, provenance, restricted archive packaging and W01 sidecar adapter compatibility')
          PY
