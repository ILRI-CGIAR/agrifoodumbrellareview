name: W00 Lens and OpenAlex title abstract keyword searches
on:
  push:
    branches: [migration/w00-w03]
    paths: ['.github/workflows/lens_openalex_keywords_2015.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        provider: [lens, openalex]
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c("httr2","jsonlite","digest"))
      - name: Validate R search scripts
        shell: Rscript {0}
        run: |
          for (f in c("lens_openalex_count.R","lens_openalex_retrieve_shard.R","lens_openalex_merge.R","lens_openalex_archive_zenodo.R")) {
            invisible(parse(file=file.path("scripts/updater",f)))
          }
      - name: Count 7 components
        env:
          LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_API_TOKEN: ${{ secrets.OPENALEX_API_TOKEN }}
        run: Rscript scripts/updater/lens_openalex_count.R --provider ${{ matrix.provider }} --shard ${{ matrix.shard }}
      - name: Preserve count evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: count-${{ matrix.provider }}-${{ matrix.shard }}
          path: outputs/${{ matrix.provider }}/count/shard_${{ matrix.shard }}/
          if-no-files-found: warn
          retention-days: 30
  retrieve:
    needs: count
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        provider: [lens, openalex]
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c("httr2","jsonlite","digest"))
      - name: Restore matched count checkpoint
        uses: actions/download-artifact@v4
        with:
          name: count-${{ matrix.provider }}-${{ matrix.shard }}
          path: outputs/${{ matrix.provider }}/count/shard_${{ matrix.shard }}
      - name: Retrieve full bibliographic metadata
        env:
          LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_API_TOKEN: ${{ secrets.OPENALEX_API_TOKEN }}
        run: Rscript scripts/updater/lens_openalex_retrieve_shard.R --provider ${{ matrix.provider }} --shard ${{ matrix.shard }}
      - name: Preserve retrieval and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: records-${{ matrix.provider }}-${{ matrix.shard }}
          path: outputs/${{ matrix.provider }}/shard_${{ matrix.shard }}/
          if-no-files-found: warn
          retention-days: 1
  merge_archive:
    needs: retrieve
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        provider: [lens, openalex]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c("httr2","jsonlite","digest"))
      - name: Download all count and retrieval shards
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER: ${{ matrix.provider }}
        shell: bash
        run: |
          set -euo pipefail
          for shard in 1 2 3 4 5; do
            mkdir -p "outputs/$PROVIDER/count/shard_$shard" "outputs/$PROVIDER/shard_$shard"
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "count-$PROVIDER-$shard" --dir "outputs/$PROVIDER/count/shard_$shard"
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "records-$PROVIDER-$shard" --dir "outputs/$PROVIDER/shard_$shard"
          done
      - name: Verify counts and internally deduplicate
        run: Rscript scripts/updater/lens_openalex_merge.R --provider ${{ matrix.provider }}
      - name: Archive restricted bibliographic data to a new Zenodo record
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: Rscript scripts/updater/lens_openalex_archive_zenodo.R --provider ${{ matrix.provider }}
      - name: Preserve validation summary and Zenodo receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summary-${{ matrix.provider }}
          path: |
            outputs/${{ matrix.provider }}/dedup_summary.json
            outputs/${{ matrix.provider }}/zenodo_receipt.json
          if-no-files-found: warn
          retention-days: 30
