name: Lens and OpenAlex 2015+ dataset-excluded count probe
on:
  push:
    branches: [migration/w00-w03]
    paths: ['.github/workflows/lens_openalex_count.yml']
permissions:
  contents: read
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        provider: [lens, openalex]
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c("httr2","jsonlite","digest"))
      - name: Validate script
        shell: Rscript {0}
        run: invisible(parse(file="scripts/updater/lens_openalex_count.R"))
      - name: Count excluding datasets
        env:
          LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_API_TOKEN: ${{ secrets.OPENALEX_API_TOKEN }}
        run: Rscript scripts/updater/lens_openalex_count.R --provider ${{ matrix.provider }} --shard ${{ matrix.shard }}
      - name: Save count checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.provider }}-dataset-excluded-count-${{ matrix.shard }}
          path: outputs/${{ matrix.provider }}/count/shard_${{ matrix.shard }}/counts.json
          retention-days: 14
          if-no-files-found: warn
