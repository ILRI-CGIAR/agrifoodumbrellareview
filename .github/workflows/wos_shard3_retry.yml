name: Web of Science final count group retry
on:
  push:
    branches: [migration/w00-w03]
    paths: ['.github/workflows/wos_shard3_retry.yml']
permissions:
  contents: read
jobs:
  shard3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install API dependencies
        shell: Rscript {0}
        run: install.packages(c("httr2","jsonlite","digest"))
      - name: Count final WoS group
        env:
          WOS_STARTER_API: ${{ secrets.WOS_STARTER_API }}
        run: Rscript scripts/updater/wos_partition_count.R --shard 3
      - name: Save response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wos-count-shard3-retry
          path: outputs/wos/shard_3/counts.json
          retention-days: 7
          if-no-files-found: warn
