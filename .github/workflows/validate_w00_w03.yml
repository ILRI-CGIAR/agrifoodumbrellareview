name: W00-W03 R script validation
on:
  push:
    branches:
      - migration/w00-w03
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Parse transferred R scripts
        shell: Rscript {0}
        run: |
          files <- list.files("scripts/updater", pattern = "\\.R$", full.names = TRUE)
          stopifnot(length(files) > 0L)
          for (file in files) {
            tryCatch(parse(file = file), error = function(e) {
              stop(sprintf("%s: %s", file, conditionMessage(e)))
            })
          }
          cat(sprintf("PASS: parsed %d R scripts\n", length(files)))
      - name: Validate configuration JSON
        run: |
          python3 - <<'PY'
          import json, pathlib
          paths = list(pathlib.Path('config').glob('*.json'))
          for path in paths:
              json.loads(path.read_text())
          print(f'PASS: {len(paths)} JSON configuration files')
          PY
