name: ILRI launch original W01 first run
on:
  push:
    branches:
      - migration/w00-w03
    paths:
      - .github/workflows/ilri_launch_original_w01.yml
permissions:
  contents: write
  actions: write
jobs:
  run-original-w01:
    uses: ./.github/workflows/workflow_01_production.yml
    with:
      execution_pathway: github
      first_run: true
      workflow00_pointer_path: docs/workflow00/ilri_validated_artifacts_2026-11-07.json
      previous_workflow01_pointer_path: ""
      model: gpt-5.6-luna
      auto_threshold: "0.95"
      max_llm_cases: 5000
      run_review_llm: false
    secrets: inherit
