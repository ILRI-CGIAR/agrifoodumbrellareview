name: Workflow 00 - Search and source archive
on:
  push:
    branches: [migration/w00-w03]
    paths: ['.github/workflows/workflow_00_production.yml']
  workflow_call:
    inputs:
      strategy_path:
        required: true
        type: string
      zenodo_config_path:
        required: true
        type: string
      run_type:
        required: false
        type: string
        default: full
      previous_w00_pointer_path:
        description: Published W00 pointer for updates; leave empty for a new first run
        required: false
        type: string
        default: ''
      execute:
        required: false
        type: boolean
        default: false
      publish:
        required: false
        type: boolean
        default: false
    secrets:
      ZENODO_ACCESS_TOKEN:
        required: false
      SCOPUS_API_TOKEN:
        required: false
      SCOPUS_INSTTOKEN:
        required: false
      OPENALEX_API_KEY:
        required: false
      OPENALEX_API_TOKEN:
        required: false
      WOS_STARTER_API:
        required: false
      LENS_API_TOKEN:
        required: false
      EBSCO_EHOST_UID:
        required: false
      EBSCO_EHOST_PWD:
        required: false
  workflow_dispatch:
    inputs:
      strategy_path:
        required: true
        type: string
      zenodo_config_path:
        required: true
        type: string
      run_type:
        required: true
        type: choice
        options: [full, fortnightly, monthly, expansion]
        default: full
      previous_w00_pointer_path:
        description: Existing published W00 pointer; required when executing updates
        required: false
        type: string
        default: ''
      execute:
        type: boolean
        required: true
        default: false
      publish:
        type: boolean
        required: true
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: workflow00-source-acquisition-${{ github.ref }}
  cancel-in-progress: false
jobs:
  search:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      pointer_path: ${{ steps.register.outputs.pointer_path }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install existing source handler dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libcurl4-openssl-dev libxml2-dev
          Rscript -e "install.packages(c('jsonlite','digest','httr2','curl','xml2'))"
      - name: Validate project-specific source strategy
        env:
          STRATEGY: ${{ inputs.strategy_path }}
          MODE: ${{ inputs.run_type }}
        run: |
          set -euo pipefail
          test -s "$STRATEGY"
          Rscript scripts/updater/workflow_00_search_orchestrator.R \
            --run-type "$MODE" --config "$STRATEGY" --output-dir outputs/workflow00/plan
      - name: Enforce explicit provider and publication permission
        env:
          EXECUTE: ${{ inputs.execute }}
          PUBLISH: ${{ inputs.publish }}
          MODE: ${{ inputs.run_type }}
          PREVIOUS_POINTER: ${{ inputs.previous_w00_pointer_path }}
          ZENODO_CONFIG: ${{ inputs.zenodo_config_path }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = true ] && [ "$EXECUTE" != true ]; then
            echo "Cannot publish without explicit execution"; exit 1
          fi
          if [ "$MODE" != full ] && [ "$EXECUTE" = true ]; then
            test -s "$PREVIOUS_POINTER" || { echo "A verified existing W00 pointer is required for updates" >&2; exit 1; }
            PREVIOUS_POINTER="$PREVIOUS_POINTER" MODE="$MODE" Rscript - <<'RS'
            x <- jsonlite::fromJSON(Sys.getenv("PREVIOUS_POINTER"),simplifyVector=FALSE)
            p <- jsonlite::fromJSON("outputs/workflow00/plan/search_plan.json",simplifyVector=FALSE)
            stopifnot(identical(as.character(x$project_id),as.character(p$project_id)))
            stopifnot(identical(x$status,"published"),identical(x$visibility,"restricted"),
              nzchar(as.character(x$zenodo_deposition_id)))
            old <- as.character(unlist(x$sources,use.names=FALSE))
            current <- names(p$source_definitions)
            if(Sys.getenv("MODE") %in% c("monthly","fortnightly") && !setequal(old,current))
              stop("Updates require the previous W00 source roster; add new sources through expansion")
            if(Sys.getenv("MODE")=="expansion" && !length(intersect(old,current)))
              stop("An expansion must share a source with the prior archived search")
            cat("PASS: previous W00 archive verified for source-native ID comparison\n")
          RS
          fi
          if [ "$PUBLISH" = true ]; then
            test -s "$ZENODO_CONFIG" || { echo "Project Zenodo configuration required before API calls" >&2; exit 1; }
            ZENODO_CONFIG="$ZENODO_CONFIG" Rscript - <<'RS'
            cfg <- jsonlite::fromJSON(Sys.getenv("ZENODO_CONFIG"),simplifyVector=FALSE)
            stopifnot(!is.null(cfg$title),nzchar(as.character(cfg$title)),
              !grepl("REPLACE_WITH_",as.character(cfg$title),fixed=TRUE),
              length(cfg$creators)>0L)
            for(c in cfg$creators) stopifnot(!is.null(c$name),nzchar(as.character(c$name)),
              !grepl("REPLACE_WITH_",as.character(c$name),fixed=TRUE))
            cat("PASS: project-specific Zenodo metadata preflight\n")
          RS
          fi
      - name: Restore prior source manifest and native-ID history for updates
        if: inputs.execute == true && inputs.run_type != 'full'
        env:
          PREVIOUS_POINTER: ${{ inputs.previous_w00_pointer_path }}
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ZENODO_ACCESS_TOKEN" || { echo "Zenodo access token required to restore update history" >&2; exit 1; }
          Rscript scripts/updater/workflow_01_restore_workflow00_from_zenodo.R \
            --pointer "$PREVIOUS_POINTER" \
            --output-root outputs/workflow00/history
          echo "PASS: restored published historical source archive for exact native-ID reconciliation"
      - name: Invoke each inherited provider handler, or dry-run only
        env:
          EXECUTE: ${{ inputs.execute }}
          MODE: ${{ inputs.run_type }}
          SCOPUS_API_TOKEN: ${{ secrets.SCOPUS_API_TOKEN }}
          SCOPUS_INSTTOKEN: ${{ secrets.SCOPUS_INSTTOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_API_TOKEN: ${{ secrets.OPENALEX_API_TOKEN }}
          WOS_STARTER_API: ${{ secrets.WOS_STARTER_API }}
          LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}
          EBSCO_EHOST_UID: ${{ secrets.EBSCO_EHOST_UID }}
          EBSCO_EHOST_PWD: ${{ secrets.EBSCO_EHOST_PWD }}
        run: |
          set -euo pipefail
          SOURCES="$(Rscript -e 'x<-jsonlite::fromJSON("outputs/workflow00/plan/search_plan.json",simplifyVector=FALSE);cat(paste(names(x$source_definitions),collapse=" "))')"
          for SOURCE in $SOURCES; do
            Rscript scripts/updater/workflow_00_execute_source.R \
              --search-plan outputs/workflow00/plan/search_plan.json \
              --source "$SOURCE" --output-root outputs/workflow00/harvests \
              --execute "$EXECUTE"
            if [ "$EXECUTE" = true ]; then
              HISTORY="outputs/workflow00/empty_history"
              if [ "$MODE" != full ]; then HISTORY="outputs/workflow00/history/$SOURCE"; fi
              mkdir -p "$HISTORY"
              case "$SOURCE" in
                lens|scopus|openalex|agricola|pubmed|ethos|cba|epmc_preprints|wos)
                  Rscript scripts/updater/workflow_00_native_id_reconcile.R \
                    --source "$SOURCE" \
                    --run-type "$MODE" \
                    --current-root "outputs/workflow00/harvests/$SOURCE/source_child" \
                    --history-root "$HISTORY" \
                    --output-dir "outputs/workflow00/harvests/$SOURCE/native_id_reconciliation"
                  ;;
                *)
                  Rscript scripts/updater/workflow_00_sidecar_native_id_reconcile.R \
                    --source "$SOURCE" \
                    --run-type "$MODE" \
                    --current-root "outputs/workflow00/harvests/$SOURCE/source_child" \
                    --history-root "$HISTORY" \
                    --output-dir "outputs/workflow00/harvests/$SOURCE/native_id_reconciliation"
                  ;;
              esac
              Rscript scripts/updater/workflow_00_record_source.R \
                --search-plan outputs/workflow00/plan/search_plan.json \
                --source "$SOURCE" --output-root outputs/workflow00
            fi
          done
      - name: Validate source provenance and assemble offline archive
        if: inputs.execute == true
        env:
          ZENODO_CONFIG: ${{ inputs.zenodo_config_path }}
          MODE: ${{ inputs.run_type }}
        run: |
          set -euo pipefail
          test -s "$ZENODO_CONFIG"
          Rscript scripts/updater/workflow_00_validate_search_receipts.R \
            --search-plan outputs/workflow00/plan/search_plan.json \
            --receipts-dir outputs/workflow00/search_records \
            --output outputs/workflow00/plan/source_search_report.json
          SOURCES="$(Rscript -e 'x<-jsonlite::fromJSON("outputs/workflow00/plan/search_plan.json",simplifyVector=FALSE);cat(paste(names(x$source_definitions),collapse=","))')"
          VERSION="$(Rscript -e 'x<-jsonlite::fromJSON("outputs/workflow00/plan/search_plan.json");cat(x$search_version)')"
          PROJECT_ID="$(Rscript -e 'x<-jsonlite::fromJSON("outputs/workflow00/plan/search_plan.json");cat(x$project_id)')"
          Rscript scripts/updater/workflow_00_archive_to_zenodo.R \
            --staging-root outputs/workflow00 --run-id "$GITHUB_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" --run-type "$MODE" \
            --search-version "$VERSION" --project-id "$PROJECT_ID" --sources "$SOURCES" \
            --zenodo-config "$ZENODO_CONFIG" \
            --output-dir outputs/workflow00_archive --validate-only true
      - name: Publish restricted source archive only when explicitly requested
        if: inputs.execute == true && inputs.publish == true
        env:
          ZENODO_CONFIG: ${{ inputs.zenodo_config_path }}
          MODE: ${{ inputs.run_type }}
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ZENODO_ACCESS_TOKEN"
          SOURCES="$(Rscript -e 'x<-jsonlite::fromJSON("outputs/workflow00/plan/search_plan.json",simplifyVector=FALSE);cat(paste(names(x$source_definitions),collapse=","))')"
          VERSION="$(Rscript -e 'x<-jsonlite::fromJSON("outputs/workflow00/plan/search_plan.json");cat(x$search_version)')"
          PROJECT_ID="$(Rscript -e 'x<-jsonlite::fromJSON("outputs/workflow00/plan/search_plan.json");cat(x$project_id)')"
          Rscript scripts/updater/workflow_00_archive_to_zenodo.R \
            --staging-root outputs/workflow00 --run-id "$GITHUB_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" --run-type "$MODE" \
            --search-version "$VERSION" --project-id "$PROJECT_ID" --sources "$SOURCES" \
            --zenodo-config "$ZENODO_CONFIG" \
            --output-dir outputs/workflow00_archive
      - name: Register new archived search receipt
        id: register
        if: inputs.execute == true && inputs.publish == true
        run: |
          set -euo pipefail
          Rscript scripts/updater/workflow_00_update_zenodo_registry.R \
            --receipt outputs/workflow00_archive/zenodo_receipt.json \
            --registry docs/search_record/zenodo_registry.csv \
            --pointer-dir docs/search_record/zenodo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add docs/search_record/zenodo_registry.csv "docs/search_record/zenodo/run-$GITHUB_RUN_ID.json"
          git commit -m "Register verified source archive for run $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "pointer_path=docs/search_record/zenodo/run-$GITHUB_RUN_ID.json" >> "$GITHUB_OUTPUT"
      - name: Reconcile published source DOI into final methods report
        if: inputs.execute == true && inputs.publish == true
        run: |
          set -euo pipefail
          POINTER="docs/search_record/zenodo/run-$GITHUB_RUN_ID.json"
          test -s "$POINTER"
          Rscript scripts/updater/workflow_00_validate_search_receipts.R \
            --search-plan outputs/workflow00/plan/search_plan.json \
            --receipts-dir outputs/workflow00/search_records \
            --archive-pointer "$POINTER" \
            --require-published true \
            --output outputs/workflow00/plan/source_search_report_published.json
      - name: Preserve data and validation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow00-handoff-${{ github.run_id }}
          path: |
            outputs/workflow00/plan/
            outputs/workflow00/search_records/
            outputs/workflow00/harvests/
            outputs/workflow00_archive/offline_validation.json
            outputs/workflow00_archive/zenodo_receipt.json
          retention-days: 30
          if-no-files-found: warn

  econlit_retrieval:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R EBSCO dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxml2-dev libcurl4-openssl-dev unzip
          Rscript -e "install.packages(c('httr2','xml2','jsonlite','digest'))"
      - name: Restore archived search and expected component counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git show 6865085b49a95b70cc7c4dd9f829e82a032d995f:scripts/updater/econlit_count_probe.R > /tmp/econlit_count_probe.R
          git show 6865085b49a95b70cc7c4dd9f829e82a032d995f:user_input/scopus_search_2015_onwards.txt > user_input/scopus_search_2015_onwards.txt
          mkdir -p /tmp/econlit_artifact
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/ILRI-CGIAR/agrifoodumbrellareview/actions/artifacts/13567813895/zip -o /tmp/econlit_artifact.zip
          unzip -q /tmp/econlit_artifact.zip -d /tmp/econlit_artifact
          test -s /tmp/econlit_artifact/count_report.json
      - name: Retrieve EconLit detailed records and export RIS
        env:
          EBSCO_EHOST_UID: ${{ secrets.EBSCO_EHOST_UID }}
          EBSCO_EHOST_PWD: ${{ secrets.EBSCO_EHOST_PWD }}
        run: |
          Rscript - <<'RS'
          suppressPackageStartupMessages({library(jsonlite);library(xml2);library(httr2);library(digest)})
          legacy <- readLines("/tmp/econlit_count_probe.R",warn=FALSE)
          stop_at <- grep("^result <- list\\(",legacy)[1]
          stopifnot(length(stop_at)==1L,is.finite(stop_at))
          eval(parse(text=paste(legacy[seq_len(stop_at-1L)],collapse="\n")),envir=.GlobalEnv)
          baseline <- fromJSON("/tmp/econlit_artifact/count_report.json",simplifyVector=FALSE)
          stopifnot(length(queries)==35L,length(baseline$components)==35L)
          dir.create("outputs/econlit/retrieval",recursive=TRUE,showWarnings=FALSE)
          txt <- function(x,xp) {
            nodes <- xml_find_all(x,xp)
            if (!length(nodes)) return("")
            z <- trimws(xml_text(nodes[[1L]]))
            if(length(z) && !is.na(z)) z else ""
          }
          parse_rec <- function(x) {
            h <- xml_find_first(x,".//*[local-name()='header']")
            id <- if(inherits(h,"xml_missing")) "" else xml_attr(h,"uiTerm")
            if(is.null(id)||is.na(id)||!nzchar(id)) id <- txt(x,".//*[local-name()='ui' and not(@type)]")
            if(!nzchar(id)) stop("Missing EBSCO accession number in retrieved detailed record")
            dt <- xml_find_first(x,".//*[local-name()='dt']")
            year <- if(inherits(dt,"xml_missing")) "" else xml_attr(dt,"year")
            if(is.null(year)||is.na(year)) year <- ""
            au <- trimws(xml_text(xml_find_all(x,".//*[local-name()='au']")))
            kw <- trimws(xml_text(xml_find_all(x,".//*[local-name()='kw']")))
            doi <- txt(x,".//*[local-name()='ui' and translate(@type,'DOI','doi')='doi']")
            list(id=id,title=txt(x,".//*[local-name()='atl']"),abstract=txt(x,".//*[local-name()='ab']"),
                 journal=txt(x,".//*[local-name()='jtl']"),year=year,authors=au[nzchar(au)],
                 keywords=kw[nzchar(kw)],doi=doi,source="EconLit",db_code="ecn")
          }
          retrieve <- function(q,label) {
            all <- list()
            start <- 1L
            total <- NA_integer_
            repeat {
              d <- fetch("Search",list(prof=uid,pwd=pwd,authType="profile",db="ecn",
                   query=q,format="detailed",startrec=as.character(start),numrec="100"))
              counts <- as.integer(xml_text(xml_find_all(d,"//*[local-name()='Hits']")))
              counts <- counts[!is.na(counts)]
              if(!length(counts)) stop(paste("No Hits in",label))
              n <- counts[[1L]]
              if(is.na(total)) total <- n
              if(n!=total) stop(paste("Count changed",label))
              nodes <- xml_find_all(d,"//*[local-name()='rec']")
              if(!length(nodes) && total > 0L) stop(paste("No records despite hits",label))
              if(length(nodes)) all <- c(all,lapply(nodes,parse_rec))
              if(length(all)>=total) break
              start <- length(all)+1L
              if(start>5000L) stop("Pagination exceeds safety window")
            }
            if(length(all)!=total) stop(paste("Count mismatch",label,total,length(all)))
            list(records=all,total=total)
          }
          seen <- new.env(hash=TRUE,parent=emptyenv())
          membership <- new.env(hash=TRUE,parent=emptyenv())
          rows <- list()
          for(k in seq_along(queries)){
            q <- queries[[k]]
            ids <- integer()
            ij <- as.integer(strsplit(q$component,":",fixed=TRUE)[[1L]])
            method <- baseline$components[[k]]$method
            use_chunks <- identical(method,"partitioned_accession_id_union")
            local <- list()
            if(!use_chunks) {
              direct <- tryCatch(retrieve(q$query,q$component),error=identity)
              if(inherits(direct,"error")){
                message(sprintf("Direct retrieval %s failed (%s), using chunked search",q$component,conditionMessage(direct)))
                use_chunks <- TRUE
              } else local <- direct$records
            }
            if(use_chunks){
              terms <- flatten_or(agri[[ij[[2L]]]])
              if(length(terms)<2L)stop(paste("Cannot split failed query",q$component))
              chunks <- split(terms,ceiling(seq_along(terms)/4L))
              for(ci in seq_along(chunks)){
                chunk <- paste(chunks[[ci]],collapse=" OR ")
                cq <- paste0("(",field_block(climate[[ij[[1L]]]])," AND ",field_block(review),
                             " AND ",field_block(chunk),") AND (DT 20150101-)")
                got <- retrieve(cq,paste(q$component,ci,sep="/"))
                local <- c(local,got$records)
              }
            }
            ids <- vapply(local,function(x)x$id,character(1))
            distinct <- unique(ids)
            expected <- as.integer(baseline$components[[k]]$hits)
            if(length(distinct)!=expected)stop(sprintf("Component %s expected %d, retrieved %d distinct",q$component,expected,length(distinct)))
            for(rec in local){
              id <- rec$id
              if(!exists(id,envir=seen,inherits=FALSE))assign(id,rec,envir=seen)
              old <- if(exists(id,envir=membership,inherits=FALSE))get(id,envir=membership) else character()
              assign(id,unique(c(old,q$component)),envir=membership)
            }
            rows[[k]] <- data.frame(component=q$component,expected=expected,retrieved=length(distinct),
                                     method=method,query=q$query,stringsAsFactors=FALSE)
            message(sprintf("PASS EconLit %s %d unique within component",q$component,length(distinct)))
          }
          stopifnot(sum(vapply(rows,function(x)x$retrieved,integer(1)))==162L)
          ids <- sort(ls(seen,all.names=TRUE))
          one <- function(tag,x) {
            if(is.null(x)||!length(x))return(character())
            z <- trimws(gsub("[\r\n\t]+"," ",as.character(x)))
            paste0(tag,"  - ",z[nzchar(z)])
          }
          ris <- unlist(lapply(ids,function(id){
            r <- get(id,envir=seen)
            c("TY  - GEN",one("TI",r$title),one("AU",r$authors),
              one("PY",r$year),one("JO",r$journal),
              one("AB",r$abstract),one("KW",r$keywords),
              one("DO",r$doi),one("ID",paste0("ecn:",id)),
              one("DB","EconLit"),one("DP","EBSCOhost"),
              one("N1",paste0("EBSCOhost accession number: ",id)),
              one("N1",paste0("Matched search components: ",paste(get(id,envir=membership),collapse=", "))),
              "ER  - ","")
          }),use.names=FALSE)
          writeLines(ris,"outputs/econlit/retrieval/EconLit_2015_onwards.ris",useBytes=TRUE)
          write.csv(do.call(rbind,rows),"outputs/econlit/retrieval/component_search_report.csv",row.names=FALSE)
          write_json(list(database="EconLit",database_code="ecn",search_date_original="2026-11-07",
            retrieval_date_utc=format(Sys.time(),tz="UTC",format="%Y-%m-%dT%H:%M:%SZ"),
            fields=c("TI","AB"),from_year=2015,component_occurrences=162L,
            unique_accession_records=length(ids),components=lapply(seq_along(rows),function(i)list(
              component=rows[[i]]$component,hits=rows[[i]]$retrieved,query=rows[[i]]$query))),
            "outputs/econlit/retrieval/search_report.json",pretty=TRUE,auto_unbox=TRUE)
          message(sprintf("SUCCESS: %d unique EconLit accession records from 162 component hits",length(ids)))
          RS
      - name: Preserve EconLit RIS and full search report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: econlit-retrieved-ris-${{ github.run_id }}
          path: outputs/econlit/retrieval/
          retention-days: 30
          if-no-files-found: warn
