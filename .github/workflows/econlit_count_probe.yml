name: W00 EconLit EBSCO API count validation
on:
  push:
    branches: [migration/w00-w03]
    paths: ['.github/workflows/econlit_count_probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  econlit-count:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c("httr2","xml2","jsonlite","digest"))
      - name: Validate translation script
        shell: Rscript {0}
        run: invisible(parse(file="scripts/updater/econlit_count_probe.R"))
      - name: Count EconLit searches (2015 onwards, TI/AB)
        env:
          EBSCO_EHOST_UID: ${{ secrets.EBSCO_EHOST_UID }}
          EBSCO_EHOST_PWD: ${{ secrets.EBSCO_EHOST_PWD }}
        run: Rscript scripts/updater/econlit_count_probe.R
      - name: Preserve translated queries and counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: econlit-2015-count-report
          path: outputs/econlit/count/
          retention-days: 30
          if-no-files-found: warn
