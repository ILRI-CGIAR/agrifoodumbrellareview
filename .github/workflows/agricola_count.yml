name: AGRICOLA Europe PMC 2015+ count-only probe
on:
  push:
    branches: [migration/w00-w03]
    paths: ['.github/workflows/agricola_count.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  counts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependencies
        shell: Rscript {0}
        run: install.packages(c("httr2","jsonlite","digest"))
      - name: Verify syntax
        shell: Rscript {0}
        run: invisible(parse(file="scripts/updater/agricola_europepmc_count.R"))
      - name: Count AGR records with 2015+ translated query
        run: Rscript scripts/updater/agricola_europepmc_count.R --shard ${{ matrix.shard }}
      - name: Preserve queries and API counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agricola-count-shard-${{ matrix.shard }}
          path: outputs/agricola/shard_${{ matrix.shard }}/counts.json
          retention-days: 14
          if-no-files-found: warn
  summary:
    needs: counts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: agricola-count-shard-*
          path: count-artifacts
      - name: Verify all 35 component counts
        run: |
          python3 - <<'PY'
          import json,glob
          f=glob.glob('count-artifacts/agricola-count-shard-*/counts.json')
          assert len(f)==5, len(f)
          n=t=0
          for path in sorted(f):
              x=json.load(open(path))
              assert x["complete"] and not x["errors"] and not x["pending"],path
              count=sum(int(y["total_results"]) for y in x["summaries"])
              print(path,count)
              n+=len(x["summaries"]);t+=count
          print(f'PASS AGR source count-only: {n} queries, {t} summed component hits (not unique)')
          assert n>=35
          PY
