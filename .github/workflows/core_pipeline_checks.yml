name: Core pipeline tests
on:
  push:
    branches: [migration/w00-w03]
    paths:
      - scripts/updater/workflow_00_search_orchestrator.R
      - scripts/updater/workflow_00_resolve_source_selection.R
      - scripts/updater/write_workflow00_search_record.R
      - tests/**
      - .github/workflows/core_pipeline_checks.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/w00-w03
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install test dependencies
        run: Rscript -e "install.packages('jsonlite')"
      - name: Test core search functions without API requests or Zenodo writes
        run: bash tests/test_workflow00_core.sh
