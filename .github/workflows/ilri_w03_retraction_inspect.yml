name: TEMP inspect W03 retraction classification
on:
  push:
    branches: [migration/w00-w03]
    paths: ['.github/workflows/ilri_w03_retraction_inspect.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/w00-w03
      - name: Read published W03 status and check retracted article
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p status
          gh run download 42418518879 --repo "$GITHUB_REPOSITORY" --name workflow03-handoff-42418518879 --dir status
          python3 - <<'PY'
          import json,glob
          fs=glob.glob('status/**/publication_status.jsonl',recursive=True)
          assert len(fs)==1,fs
          matches=[]
          with open(fs[0],encoding='utf-8') as f:
            for line in f:
              x=json.loads(line)
              if x['record_id']=='work-62e05020845ad8b5':matches.append(x)
          assert len(matches)==1,len(matches)
          print('TARGET_W03_STATUS',json.dumps(matches[0],ensure_ascii=False))
          PY