name: Web of Science shard 1 retry
on:
  push:
    branches: [migration/w00-w03]
    paths: ['.github/workflows/wos_shard1_retry.yml']
permissions:
  contents: read
  actions: read
jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R API dependencies
        shell: Rscript {0}
        run: install.packages(c("httr2","jsonlite","digest"))
      - name: Restore validated count checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs/wos/count/shard_1
          gh run download 42301105871 --repo "$GITHUB_REPOSITORY" --name wos-count-shard-1 --dir outputs/wos/count/shard_1
      - name: Retrieve shard 1
        env:
          WOS_STARTER_API: ${{ secrets.WOS_STARTER_API }}
        run: Rscript scripts/updater/wos_retrieve_shard.R --shard 1
      - name: Save shard checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wos-recovered-shard-1
          path: outputs/wos/shard_1/
          retention-days: 1
          if-no-files-found: warn
