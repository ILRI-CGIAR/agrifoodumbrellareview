name: Web of Science completed-shards recovery merge
on:
  push:
    branches: [migration/w00-w03]
    paths: ['.github/workflows/wos_completed_merge.yml']
permissions:
  contents: read
  actions: read
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c("httr2","jsonlite","digest"))
      - name: Restore five validated WoS count snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for shard in 1 2 3 4 5; do
            mkdir -p "outputs/wos/count/shard_$shard"
            gh run download 42301105871 --repo "$GITHUB_REPOSITORY" --name "wos-count-shard-$shard" --dir "outputs/wos/count/shard_$shard"
          done
      - name: Restore five successful WoS bibliographic shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs/wos/shard_1
          gh run download 42303244116 --repo "$GITHUB_REPOSITORY" --name wos-recovered-shard-1 --dir outputs/wos/shard_1
          for shard in 2 3 4 5; do
            mkdir -p "outputs/wos/shard_$shard"
            gh run download 42302402059 --repo "$GITHUB_REPOSITORY" --name "wos-2015-record-shard-$shard" --dir "outputs/wos/shard_$shard"
          done
      - name: Verify all 24,084 occurrences and deduplicate WoS UIDs
        run: Rscript scripts/updater/wos_merge_internal.R
      - name: Publish restricted Zenodo archive
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: Rscript scripts/updater/wos_archive_restricted_zenodo.R
      - name: Preserve safe count and Zenodo receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wos-2015-recovered-dedup-summary
          path: |
            outputs/wos/dedup_summary.json
            outputs/wos/zenodo_receipt.json
          retention-days: 30
          if-no-files-found: warn
