name: Recover Scopus oversized retrieval partitions
on:
  push:
    branches: [migration/w00-w03]
    paths: ['.github/workflows/scopus_recovery.yml']
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c("httr2","jsonlite","digest"))
      - name: Check R script syntax
        shell: Rscript {0}
        run: |
          invisible(parse(file="scripts/updater/scopus_retrieve_shard.R"))
          invisible(parse(file="scripts/updater/scopus_merge_internal.R"))
          invisible(parse(file="scripts/updater/scopus_archive_restricted_zenodo.R"))
          cat("PASS: scripts parse\n")
      - name: Restore existing completed partitions and count checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs/scopus/source outputs/scopus/shard_${{ matrix.shard }}
          gh run download 42258635034 --repo "$GITHUB_REPOSITORY" --name scopus-2015-api-probe --dir outputs/scopus/source
          gh run download 42265469964 --repo "$GITHUB_REPOSITORY" --name scopus-2015-shard-${{ matrix.shard }} --dir outputs/scopus/shard_${{ matrix.shard }}
      - name: Recover missing Scopus pages and verify original counts
        env:
          SCOPUS_API_TOKEN: ${{ secrets.SCOPUS_API_TOKEN }}
          SCOPUS_INSTTOKEN: ${{ secrets.SCOPUS_INSTTOKEN }}
        run: Rscript scripts/updater/scopus_retrieve_shard.R --shard ${{ matrix.shard }}
      - name: Save recovered shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovered-scopus-shard-${{ matrix.shard }}
          path: outputs/scopus/shard_${{ matrix.shard }}/
          retention-days: 1
          if-no-files-found: warn
  merge:
    needs: recover
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c("httr2","jsonlite","digest"))
      - name: Restore completed search and earlier successful shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs/scopus/source
          gh run download 42258635034 --repo "$GITHUB_REPOSITORY" --name scopus-2015-api-probe --dir outputs/scopus/source
          for shard in 1 3 4; do
            mkdir -p "outputs/scopus/shard_$shard"
            gh run download 42265469964 --repo "$GITHUB_REPOSITORY" --name "scopus-2015-shard-$shard" --dir "outputs/scopus/shard_$shard"
          done
      - uses: actions/download-artifact@v4
        with:
          name: recovered-scopus-shard-0
          path: outputs/scopus/shard_0
      - uses: actions/download-artifact@v4
        with:
          name: recovered-scopus-shard-2
          path: outputs/scopus/shard_2
      - name: Verify all 200 partitions and deduplicate by EID
        run: Rscript scripts/updater/scopus_merge_internal.R
      - name: Deposit internally deduplicated bibliographic output in restricted Zenodo
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: Rscript scripts/updater/scopus_archive_restricted_zenodo.R
      - name: Publish count and restricted Zenodo receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scopus-recovery-summary
          path: |
            outputs/scopus/dedup_summary.json
            outputs/scopus/zenodo_receipt.json
          retention-days: 30
          if-no-files-found: warn
