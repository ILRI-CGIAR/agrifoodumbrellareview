name: TEMP ILRI W02 saved-output inspection
on:
  push:
    branches: [migration/w00-w03]
    paths: ['.github/workflows/ilri_w02_saved_output_inspect.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect original W02 artifacts without calling providers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for name in workflow02-human-review-42405126427 workflow02-batched-final-42405126427 workflow02-abstract-review-source-42405126427 workflow02-finalize-input-42405126427; do
            mkdir -p "saved/$name"
            gh run download 42405126427 --repo "$GITHUB_REPOSITORY" --name "$name" --dir "saved/$name"
            echo "ARTIFACT $name"
            find "saved/$name" -type f | sort | sed -n '1,65p'
          done
          echo "ORIGINAL_TECHNICAL_RETRIES $(wc -l < saved/workflow02-batched-final-42405126427/workflow02/retry_queue.jsonl)"
          python3 - <<'PY'
          import json,glob
          for p in glob.glob('saved/**/status.json',recursive=True):
              print('STATUS',p,open(p).read()[:1500])
          for p in glob.glob('saved/**/workflow02_human_review_manifest.json',recursive=True):
              print('REVIEW_MANIFEST',p,open(p).read()[:1700])
          PY